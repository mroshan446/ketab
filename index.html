<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d2433;--mu:#6b7280;--pr:#1f6f5c;--bd:#e2ded4;--wr:#b42318;--ok:#1f6f5c}
@media(prefers-color-scheme:dark){:root{--bg:#14181f;--card:#1e242e;--tx:#e8eaee;--mu:#9aa3b2;--pr:#3aa58b;--bd:#2f3744;--wr:#f08a7e;--ok:#3aa58b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px Vazirmatn,Tahoma,sans-serif;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:8px;padding:10px 14px}header img{width:34px;height:34px;border-radius:8px}header b{font-size:19px;flex:1}
nav{display:flex;gap:6px;padding:6px 12px;overflow-x:auto}nav button{flex:1 0 auto;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;white-space:nowrap}nav button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
main{padding:8px 12px 40px;max-width:760px;margin:auto}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
h3{margin:2px 0 10px;font-size:16px}label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:flex;gap:8px;align-items:flex-end}.row>*{flex:1}.fit{flex:0 0 auto!important}

.btn.sm{padding:6px 10px;font-size:13px}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}.item:last-child{border:0}.item>div:nth-child(2){flex:1}
.mu{color:var(--mu);font-size:13px}.bad{color:var(--wr)}.good{color:var(--ok)}.hid{display:none}
.cv{width:54px;height:76px;border-radius:6px;object-fit:cover;background:var(--bd);flex:0 0 auto}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;z-index:9;padding:16px;overflow:auto}#ov>div{background:var(--card);border-radius:14px;padding:14px;width:100%;max-width:440px}

<div id="app"></div><div id="ov"><div id="ob"></div></div>
<script>

const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dv=(a,b)=>Math.floor(a/b),P=x=>String(x).replace(/\d/g,c=>'۰۱۲۳۴۵۶۷۸۹'[c]);
function g2j(gy,gm,gd){const g=[0,31,59,90,120,151,181,212,243,273,304,334];let jy=gy<=1600?0:979;gy-=gy<=1600?621:1600;const g2=gm>2?gy+1:gy;let d=365*gy+dv(g2+3,4)-dv(g2+99,100)+dv(g2+399,400)-80+gd+g[gm-1];jy+=33*dv(d,12053);d%=12053;jy+=4*dv(d,1461);d%=1461;if(d>365){jy+=dv(d-1,365);d=(d-1)%365}return[jy,d<186?1+dv(d,31):7+dv(d-186,30),1+(d<186?d%31:(d-186)%30)]}
const fd=d=>{if(!d)return'—';const[y,m,x]=d.split('-').map(Number),j=g2j(y,m,x);return P(j[0]+'/'+String(j[1]).padStart(2,'0')+'/'+String(j[2]).padStart(2,'0'))};
const today=()=>new Date().toISOString().slice(0,10);
const AGES={kid:'کودک (زیر ۱۲)',teen:'نوجوان (۱۲ تا ۱۷)',adult:'بزرگسال (۱۸+)',all:'همه سنین'};
const ageOpts=(v,all)=>(all?'<option value="">همهٔ رده‌های سنی</option>':'')+Object.keys(AGES).map(k=>`<option value="${k}"${k===v?' selected':''}>${AGES[k]}</option>`).join('');

const PAL=['#2f8f7a','#d9822b','#4a6fa5','#b5527a','#8a8f3c','#7a5ea8'];
function donut(items){
  const tot=items.reduce((a,x)=>a+x.v,0);if(!tot)return'<div class="mu">داده‌ای ثبت نشده است</div>';
  const R=42,C=2*Math.PI*R;let off=0;
  const arcs=items.filter(x=>x.v>0).map(x=>{const len=x.v/tot*C,t=`<circle r="${R}" cx="60" cy="60" fill="none" stroke="${x.c}" stroke-width="22" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=len;return t}).join('');
  return `<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><svg viewBox="0 0 120 120" width="130" height="130">${arcs}<text x="60" y="66" text-anchor="middle" font-size="18" font-weight="700" fill="currentColor">${P(tot)}</text></svg><div>${items.map(x=>`<div style="margin:4px 0"><span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${x.c};margin-left:6px"></span>${esc(x.l)}: <b>${P(x.v)}</b> (${P(Math.round(x.v/tot*100))}٪)</div>`).join('')}</div></div>`;
}
function bars(items,unit){
  const mx=Math.max(...items.map(x=>x.v),1);
  return items.length?items.map((x,i)=>`<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${esc(x.l)}</span><b>${P(x.v)} ${unit}</b></div><div style="height:12px;background:var(--bd);border-radius:6px;overflow:hidden"><div style="height:100%;width:${x.v/mx*100}%;background:${PAL[i%PAL.length]};border-radius:6px"></div></div></div>`).join(''):'<div class="mu">داده‌ای ثبت نشده است</div>';
}

const loadImg=f=>new Promise(ok=>{const im=new Image();im.onload=()=>ok(im);im.src=URL.createObjectURL(f)});
async function shrink(f,max){const im=await loadImg(f),s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.8)}
async function compose(f,tpl){
  const im=await loadImg(f),W=600,H=800,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  await new Promise(ok=>{const t=new Image();t.onload=()=>{x.drawImage(t,0,0,W,H);ok()};t.onerror=ok;t.src=tpl});
  const s=Math.min(W*.68/im.width,H*.72/im.height),w=im.width*s,h=im.height*s;
  x.shadowColor='rgba(0,0,0,.35)';x.shadowBlur=24;x.shadowOffsetY=8;x.drawImage(im,(W-w)/2,(H-h)/2,w,h);return c.toDataURL('image/jpeg',.82);
}

async function vStats(){
  const S=await api('/api/stats'),box=(t,h)=>`<div class="card"><h3>${t}</h3>${h}</div>`,g=S.gender,a=S.ages;
  $('#view').innerHTML=`<div class="row" style="margin-bottom:10px">${[['کتاب‌ها',S.totals.books],['اعضا',S.totals.members],['در امانت',S.totals.active],['دیرکرد',S.totals.late]].map(x=>`<div class="card" style="margin:0;text-align:center"><div style="font-size:22px;font-weight:700">${P(x[1])}</div><div class="mu">${x[0]}</div></div>`).join('')}</div>`+
  box('جنسیت اعضا',donut([{l:'خانم',v:g.f||0,c:PAL[3]},{l:'آقا',v:g.m||0,c:PAL[2]},{l:'نامشخص',v:g.u||0,c:'#9aa3b2'}]))+
  box('رده‌بندی سنی اعضا',donut([{l:'کودک (زیر ۱۲)',v:a.kid||0,c:PAL[1]},{l:'نوجوان (۱۲ تا ۱۷)',v:a.teen||0,c:PAL[0]},{l:'بزرگسال (۱۸+)',v:a.adult||0,c:PAL[2]},{l:'نامشخص',v:a.u||0,c:'#9aa3b2'}]))+
  box('اعضایی که بیشترین کتاب را برده‌اند',bars(S.readers,'کتاب'))+box('پرطرفدارترین کتاب‌ها',bars(S.popular,'بار امانت'))+box('بیشترین موضوع‌های کتابخانه',bars(S.topics,'کتاب'))+box('بیشترین اهداکننده‌ها',bars(S.donors,'کتاب'));
}

/* ===== ذخیره‌سازی روی گوشی ===== */
const idbP=new Promise((ok,no)=>{const r=indexedDB.open('ketab',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const kvGet=k=>idbP.then(d=>new Promise(o=>{const r=d.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>o(r.result)}));
const kvSet=(k,v)=>idbP.then(d=>new Promise(o=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=o}));
const kvDel=k=>idbP.then(d=>new Promise(o=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=o}));
const C=['books','users','loans','resv','reviews','sugs'];
let DB,SNAP,SET={},IMG={},TPL=null;
const nid=(()=>{let l=0;return()=>{let n=Date.now()*1000+Math.floor(Math.random()*1000);if(n<=l)n=l+1;l=n;return n}})();
const freshDB=()=>{const d={topics:['رمان','شعر','تاریخی','علمی','مذهبی','کودک و نوجوان','روانشناسی','آموزشی'],tomb:{}};C.forEach(c=>{d[c]=[];d.tomb[c]={}});return d};
const norm=()=>{DB.topics=DB.topics||[];DB.tomb=DB.tomb||{};C.forEach(c=>{DB[c]=DB[c]||[];DB.tomb[c]=DB.tomb[c]||{}})};
function snapAll(){SNAP={};C.forEach(c=>{SNAP[c]={};DB[c].forEach(r=>SNAP[c][r.id]=JSON.stringify({...r,upd:0}))})}
async function loadAll(){
  DB=await kvGet('db')||freshDB();norm();SET=await kvGet('set')||{};TPL=await kvGet('tpl')||null;
  const d=await idbP,s=d.transaction('kv').objectStore('kv');
  const ks=await new Promise(o=>{const r=s.getAllKeys();r.onsuccess=()=>o(r.result)}),vs=await new Promise(o=>{const r=s.getAll();r.onsuccess=()=>o(r.result)});
  ks.forEach((k,i)=>{if(String(k).startsWith('img:'))IMG[k.slice(4)]=vs[i]});snapAll();
}
const saveSet=()=>kvSet('set',SET);
function commit(){
  const now=Date.now();
  C.forEach(c=>{const seen={};DB[c].forEach(r=>{seen[r.id]=1;const s=JSON.stringify({...r,upd:0});if(SNAP[c][r.id]!==s){r.upd=now;SNAP[c][r.id]=s}});for(const id in SNAP[c])if(!seen[id]){DB.tomb[c][id]=now;delete SNAP[c][id]}});
  kvSet('db',DB);
}
/* ===== منطق برنامه ===== */
const nf=s=>String(s??'').replace(/ي/g,'ی').replace(/ك/g,'ک').trim();
const full=u=>u?u.first+' '+u.last:'(حذف‌شده)',byId=(a,id)=>a.find(x=>x.id===+id);
const catOf=a=>a===''||a==null||isNaN(+a)?null:+a<12?'kid':+a<18?'teen':'adult';
const ad=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+ +n);return x.toISOString().slice(0,10)};
const lateDays=l=>Math.round((new Date(today()+'T12:00:00')-new Date(l.due+'T12:00:00'))/864e5);
const bookRow=b=>{const l=DB.loans.find(x=>x.bid===b.id&&!x.ret),rv=DB.reviews.filter(r=>r.bid===b.id);return{...b,cover:IMG[b.id]||null,avail:!l,holder:l?full(byId(DB.users,l.uid)):undefined,rating:rv.length?Math.round(rv.reduce((a,r)=>a+r.rating,0)/rv.length*10)/10:null,rn:rv.length}};
const loanRow=l=>{const b=byId(DB.books,l.bid),u=byId(DB.users,l.uid);return{...l,bname:b?b.name:'(حذف‌شده)',bcode:b?b.code:'',uname:full(u),phone:u?u.phone:''}};
function loanCreate(bid,uid,days,force,out0,ret0){
  const b=byId(DB.books,bid),u=byId(DB.users,uid);if(!b||!u)return{err:'کتاب یا عضو پیدا نشد'};
  if(!ret0&&DB.loans.some(l=>l.bid===bid&&!l.ret))return{err:'این کتاب هم‌اکنون در امانت است'};
  const c=catOf(u.age);if(!force&&!ret0&&b.age!=='all'&&c&&c!==b.age)return{warn:`این کتاب برای رده سنی «${AGES[b.age]}» است و سن عضو ${u.age} سال است. ادامه می‌دهید؟`};
  const rv=DB.resv.find(r=>r.bid===bid&&r.st==='ready'&&r.uid!==uid);if(!force&&!ret0&&rv)return{warn:'این کتاب برای '+full(byId(DB.users,rv.uid))+' رزرو شده است. ادامه می‌دهید؟'};
  const out=out0||today();if(ret0&&ret0<out)return{err:'تاریخ بازگشت قبل از تاریخ تحویل است'};
  DB.loans.push({id:nid(),bid,uid,out,due:ad(out,days||14),ret:ret0||null,retBy:ret0?SET.name:undefined,by:SET.name});
  if(!ret0)DB.resv.forEach(r=>{if(r.bid===bid&&r.uid===uid&&r.st!=='done')r.st='done'});return{ok:1};
}
function route(m,p,sp,B){
  const E=(e)=>[400,{error:e}],O=x=>[200,x],W=x=>{commit();return[200,x]};
  if(p==='/api/topics')return O([...new Set([...DB.topics,...DB.books.map(b=>b.topic)])].filter(Boolean));
  if(p==='/api/template'){if(m==='POST'){TPL=B.image;kvSet('tpl',TPL);return O({url:TPL})}return O({url:TPL})}
  if(p==='/api/books'||p.startsWith('/api/books/')){
    const id=+p.split('/')[3]||0;
    if(m==='GET'){let L=DB.books.slice().reverse();const q=nf(sp.get('q')),t=sp.get('topic'),a=sp.get('age');
      if(q)L=L.filter(b=>[b.name,b.author,b.publisher,b.code].some(x=>String(x||'').includes(q)));if(t)L=L.filter(b=>b.topic===t);if(a)L=L.filter(b=>b.age===a);return O(L.map(bookRow))}
    if(m==='DELETE'){if(DB.loans.some(l=>l.bid===id&&!l.ret))return E('کتاب در امانت است');
      DB.books=DB.books.filter(b=>b.id!==id);['loans','resv','reviews'].forEach(c=>DB[c]=DB[c].filter(r=>r.bid!==id));delete IMG[id];kvDel('img:'+id);return W({ok:1})}
    if(!nf(B.name))return E('نام کتاب لازم است');
    const f={name:nf(B.name),author:nf(B.author),publisher:nf(B.publisher),topic:nf(B.topic),age:AGES[B.age]?B.age:'all',donor:nf(B.donor),summary:String(B.summary||'').trim()};
    if(f.topic&&!DB.topics.includes(f.topic)&&!DB.books.some(b=>b.topic===f.topic))DB.topics.push(f.topic);
    const setImg=bid=>{if(B.cover){IMG[bid]=B.cover;kvSet('img:'+bid,B.cover);return Date.now()}return null};
    if(m==='POST'){
      let code=nf(B.code);if(!code){let n=DB.books.filter(b=>b.code.startsWith(SET.tag)).length+1;do{code=SET.tag+String(n++).padStart(4,'0')}while(DB.books.some(b=>b.code===code))}
      if(DB.books.some(b=>b.code===code))return E('این کد قبلاً ثبت شده است');
      const bid=nid();DB.books.push({id:bid,code,...f,created:today(),imgv:setImg(bid),by:SET.name});return W({id:bid,code});
    }
    const b=byId(DB.books,id);Object.assign(b,f);const iv=setImg(id);if(iv)b.imgv=iv;return W({ok:1});
  }
  if(p==='/api/members'){
    if(m==='POST'){const ph=nf(B.phone).replace(/\D/g,''),f=nf(B.first),l=nf(B.last);if(!f||!l)return E('نام و نام خانوادگی لازم است');
      if(ph&&DB.users.some(u=>u.phone===ph))return E('عضوی با این شماره قبلاً ثبت شده است');
      DB.users.push({id:nid(),first:f,last:l,age:+B.age||null,gender:B.gender||'',phone:ph,by:SET.name});return W({ok:1})}
    return O(DB.users.slice().reverse());
  }
  if(/^\/api\/members\/\d+$/.test(p)&&m==='PUT'){const u=byId(DB.users,p.split('/')[3]);if(!u)return E('عضو پیدا نشد');const ph=nf(B.phone).replace(/\D/g,''),f=nf(B.first),l=nf(B.last);
    if(!f||!l)return E('نام و نام خانوادگی لازم است');if(ph&&DB.users.some(x=>x.phone===ph&&x.id!==u.id))return E('این شماره برای عضو دیگری ثبت شده است');
    Object.assign(u,{first:f,last:l,age:+B.age||null,gender:B.gender||'',phone:ph});return W({ok:1})}
  if(/^\/api\/members\/\d+\/del$/.test(p)){const id=+p.split('/')[3];if(DB.loans.some(l=>l.uid===id))return E('این عضو سابقهٔ امانت دارد و حذف نمی‌شود');DB.users=DB.users.filter(u=>u.id!==id);DB.resv=DB.resv.filter(r=>r.uid!==id);return W({ok:1})}
  if(p==='/api/loans'){
    if(m==='POST'){const r=loanCreate(+B.bid,+B.uid,+B.days,B.force,B.out,B.ret);if(r.err)return E(r.err);if(r.warn)return[409,{warn:r.warn}];return W(r)}
    let L=DB.loans;if(sp.get('active'))L=L.filter(l=>!l.ret);return O(L.slice().reverse().map(loanRow));
  }
  if(/^\/api\/loans\/\d+\/return$/.test(p)){const l=byId(DB.loans,p.split('/')[3]);if(l&&!l.ret){const rd=B.ret||today();if(rd<l.out)return E('تاریخ بازگشت قبل از تاریخ تحویل است');l.ret=rd;l.retBy=SET.name;const rs=DB.resv.filter(r=>r.bid===l.bid&&r.st==='wait').sort((a,b)=>a.id-b.id)[0];if(rs)rs.st='ready'}return W({ok:1})}
  if(p==='/api/resv'){
    if(m==='POST'){const l=DB.loans.find(x=>x.bid===+B.bid&&!x.ret);if(!l)return E('این کتاب در کتابخانه موجود است؛ مستقیم امانت بدهید');if(l.uid===+B.uid)return E('این کتاب همین الان دست خود این عضو است');
      if(DB.resv.some(r=>r.bid===+B.bid&&r.uid===+B.uid&&r.st!=='done'))return E('برای این عضو قبلاً رزرو ثبت شده است');DB.resv.push({id:nid(),bid:+B.bid,uid:+B.uid,at:today(),st:'wait',by:SET.name});return W({ok:1})}
    return O(DB.resv.filter(r=>r.st!=='done').map(r=>{const u=byId(DB.users,r.uid),b=byId(DB.books,r.bid);return{...r,bname:b?b.name:'(حذف‌شده)',uname:full(u),phone:u?u.phone:''}}));
  }
  if(/^\/api\/resv\/\d+\/cancel$/.test(p)){const id=+p.split('/')[3];DB.resv=DB.resv.filter(r=>r.id!==id);return W({ok:1})}
  if(p==='/api/remind'){const t=today(),lim=ad(t,SET.remDays??1),df=l=>Math.round((new Date(l.due+'T12:00:00')-new Date(t+'T12:00:00'))/864e5);
    return O(DB.loans.filter(l=>!l.ret&&l.due<=lim).sort((a,b)=>a.due<b.due?-1:1).map(l=>{const r=loanRow(l),left=df(l),late=left<0,when=late?'':left===0?'امروز':left===1?'فردا':P(left)+' روز دیگر';

let HIST={mode:'b',q:''};
async function vHist(){
  const [books,mem,loans]=await Promise.all([api('/api/books'),api('/api/members'),api('/api/loans')]);
  $('#view').innerHTML=`<div class="card"><select id="hm"><option value="b">تاریخچهٔ کتاب‌ها (الان پیش کیست؟)</option><option value="m">تاریخچهٔ اعضا (چه کتاب‌هایی گرفته؟)</option></select><input id="hq" placeholder="جستجوی نام یا کد" style="margin-top:8px"></div><div id="hl"></div>`;
  $('#hm').value=HIST.mode;$('#hq').value=HIST.q;
  const line=(l,who)=>`<div class="mu">${who} — از ${fd(l.out)} ${l.ret?'تا '+fd(l.ret)+(l.ret>l.due?' <span class="bad">(با تاخیر)</span>':''):'(هنوز بازنگشته'+(l.due<today()?' — <span class="bad">'+P(lateDays(l))+' روز تاخیر</span>':'')+')'}${l.by?' · ثبت: '+esc(l.by):''}</div>`;
  const draw=()=>{HIST={mode:$('#hm').value,q:$('#hq').value};const q=nf(HIST.q);let h='';
    if(HIST.mode==='b')books.filter(b=>!q||b.name.includes(q)||b.code.includes(q)).forEach(b=>{const ls=loans.filter(l=>l.bid===b.id),a=ls.find(l=>!l.ret);
      h+=`<div class="card"><b>${esc(b.name)}</b> <span class="mu">${esc(b.code)}</span><div style="margin:4px 0">${a?'<b class="bad">امانت: '+esc(a.uname)+(a.due<today()?' ⚠️ '+P(lateDays(a))+' روز تاخیر':'')+'</b>':'<b class="good">در کتابخانه</b>'}</div>${ls.map(l=>line(l,esc(l.uname))).join('')||'<div class="mu">تاکنون امانت داده نشده</div>'}</div>`});
    else mem.filter(x=>!q||(x.first+' '+x.last).includes(q)||String(x.phone||'').includes(q)).forEach(x=>{const ls=loans.filter(l=>l.uid===x.id),cur=ls.filter(l=>!l.ret);
      h+=`<div class="card"><b>${esc(x.first+' '+x.last)}</b> <span class="mu">${esc(x.phone||'')}</span><div style="margin:4px 0">${cur.length?'<b class="bad">اکنون: '+cur.map(l=>esc(l.bname)).join('، ')+'</b>':'<b class="good">کتابی در دست ندارد</b>'}</div>${ls.map(l=>line(l,esc(l.bname))).join('')||'<div class="mu">سابقه‌ای ندارد</div>'}</div>`});
    $('#hl').innerHTML=h||'<div class="card mu">موردی پیدا نشد</div>'};
  $('#hm').onchange=draw;$('#hq').oninput=draw;draw();
}
